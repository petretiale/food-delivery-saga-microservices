version: '3.8'

networks:
  saga-net:
    driver: bridge

services:
  # ---------------------------------------------------
  # MESSAGE BROKER: RabbitMQ con interfaccia di gestione
  # ---------------------------------------------------
  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq
    ports:
      - "5672:5672"   # Protocollo AMQP
      - "15672:15672" # Dashboard Web UI
    networks:
      - saga-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------
  # DATABASE: PostgreSQL con 3 DB isolati
  # ---------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ./init-scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - saga-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------
  # MICROSERVIZIO: Order Service
  # ---------------------------------------------------
  order-service:
    build:
      context: ./order_service
      dockerfile: Dockerfile
    container_name: order-service
    ports:
      - "8081:8081"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - DB_HOST=postgres
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - saga-net

  # ---------------------------------------------------
  # MICROSERVIZIO: Payment Service
  # ---------------------------------------------------
  payment-service:
    build:
      context: ./payment_service
      dockerfile: Dockerfile
    container_name: payment-service
    ports:
      - "8082:8082"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - DB_HOST=postgres
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_started
    networks:
      - saga-net

  # ---------------------------------------------------
  # MICROSERVIZIO: Delivery Service
  # ---------------------------------------------------
  delivery-service:
    build:
      context: ./delivery_service
      dockerfile: Dockerfile
    container_name: delivery-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_RABBITMQ_HOST=rabbitmq
      - DB_HOST=postgres
      - MANAGEMENT_ZIPKIN_TRACING_ENDPOINT=http://zipkin:9411/api/v2/spans
    depends_on:
      rabbitmq:
        condition: service_healthy
      postgres:
        condition: service_healthy
      zipkin:
        condition: service_started  
    networks:
      - saga-net

  # ---------------------------------------------------
  # DISTRIBUTED TRACING: Zipkin UI & Collector
  # ---------------------------------------------------
  zipkin:
    image: openzipkin/zipkin:latest
    container_name: zipkin
    ports:
      - "9411:9411"
    networks:
      - saga-net
