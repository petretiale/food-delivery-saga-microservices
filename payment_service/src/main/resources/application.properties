spring.application.name=payment-service
server.port=8082

spring.rabbitmq.host=${SPRING_RABBITMQ_HOST:localhost}
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:5432/payment_db
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate crea la tabella se non esiste
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Abilita il campionamento di tutte le richieste (1.0 = 100%)
management.tracing.sampling.probability=1.0

# Endpoint di Zipkin (usa il container in Docker, o localhost se esegui fuori da Docker)
management.zipkin.tracing.endpoint=${MANAGEMENT_ZIPKIN_TRACING_ENDPOINT:http://localhost:9411/api/v2/spans}

# Formato log: include automaticamete [app-name,traceId,spanId] nei messaggi del logger
logging.pattern.level=%5p [${spring.application.name:},%X{traceId:-},%X{spanId:-}]
